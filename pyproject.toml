[project]
name = "renef-mcp"
version = "0.1.0"
description = "MCP server for Renef - dynamic instrumentation toolkit for Android ARM64"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "renef-mcp contributors" }]
keywords = ["renef", "mcp", "android", "instrumentation", "frida", "lua"]
dependencies = [
    "mcp>=1.12.0,<2",
]

[project.scripts]
renef-mcp = "renef_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["renef_mcp"]
